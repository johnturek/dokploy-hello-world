name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm test
      - run: docker build --build-arg GIT_SHA=${{ github.sha }} -t dokploy-hello-world:${{ github.sha }} .

  deploy:
    if: github.event_name != 'pull_request'
    needs: test-and-build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy and wait for Dokploy
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_APPLICATION_ID: ${{ secrets.DOKPLOY_APPLICATION_ID }}
        run: |
          set -euo pipefail
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          # Dokploy performs the production image build, so pass this workflow's
          # exact commit into that build—not only into the CI validation image.
          jq -n \
            --arg applicationId "$DOKPLOY_APPLICATION_ID" \
            --arg buildArgs "GIT_SHA=$GITHUB_SHA" \
            '{applicationId: $applicationId, env: "", buildArgs: $buildArgs, buildSecrets: "", createEnvFile: true}' \
          | curl --fail-with-body --retry 3 \
              -X POST "$DOKPLOY_URL/api/application.saveEnvironment" \
              -H 'content-type: application/json' \
              -H "x-api-key: $DOKPLOY_API_KEY" \
              --data-binary @-

          curl --fail-with-body --retry 3 \
            -X POST "$DOKPLOY_URL/api/application.deploy" \
            -H 'content-type: application/json' \
            -H "x-api-key: $DOKPLOY_API_KEY" \
            --data "{\"applicationId\":\"$DOKPLOY_APPLICATION_ID\",\"title\":\"GitHub Actions ${GITHUB_SHA::7}\",\"description\":\"$run_url\"}"

          for attempt in $(seq 1 60); do
            deployments=$(curl --fail --silent --show-error \
              -H "x-api-key: $DOKPLOY_API_KEY" \
              "$DOKPLOY_URL/api/deployment.all?applicationId=$DOKPLOY_APPLICATION_ID")
            status=$(jq -r --arg commit "Commit: $GITHUB_SHA" '[.[] | select(.description == $commit)][0].status // "pending"' <<<"$deployments")
            echo "Dokploy deployment status: $status"
            case "$status" in
              done) break ;;
              error) echo "$deployments" | jq .; exit 1 ;;
            esac
            sleep 10
          done
          [ "$status" = done ] || { echo "Dokploy deployment timed out" >&2; exit 1; }

      - name: Verify production
        run: |
          set -euo pipefail
          body=$(curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 5 https://hello.apps.azurefed.com/health)
          echo "$body" | grep -q '"status":"ok"'
          echo "Production is healthy: $body"
